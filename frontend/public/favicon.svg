<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Arka Plan Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Finans & İstatistik Çubukları -->
  <rect x="13" y="34" width="8" height="17" rx="3" fill="url(#bar1)"/>
  <rect x="25" y="26" width="8" height="25" rx="3" fill="url(#bar2)"/>
  <rect x="37" y="18" width="8" height="33" rx="3" fill="url(#bar3)"/>

  <!-- Yükselen Analiz Eğrisi / Trend Çizgisi -->
  <path d="M14 31 L26 23 L38 15 L49 10" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <circle cx="49" cy="10" r="3.5" fill="#34d399" filter="url(#glow)"/>

  <!-- Harita Konum / Lokasyon İkonu (Sağ Üst Rozet) -->
  <g transform="translate(34, 4)">
    <path d="M14 2 C8.48 2 4 6.48 4 12 C4 18.5 14 28 14 28 C14 28 24 18.5 24 12 C24 6.48 19.52 2 14 2 Z" fill="url(#pinGrad)"/>
    <circle cx="14" cy="11" r="3.5" fill="#ffffff"/>
  </g>
</svg>