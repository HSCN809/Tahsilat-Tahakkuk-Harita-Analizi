# --- Real IP Yapılandırması (Reverse Proxy / CDN / Ingress Arkası Gerçek İstemci IP Çözümleme) ---
# Nginx'in önündeki Railway Edge, Cloudflare, Load Balancer veya Docker iç ağlarından gelen
# X-Forwarded-For başlığını güvenli şekilde okuyarak $remote_addr ve $binary_remote_addr
# değişkenlerini GERÇEK KULLANICI IP'sine eşitler.

# Özel (Private) & Yerel Ağ CIDR Blokları (Docker / Railway Private Mesh / Kubernetes)
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1/32;
set_real_ip_from 100.64.0.0/10;
set_real_ip_from fd00::/8;
set_real_ip_from fd12::/16;
set_real_ip_from ::1;

# Cloudflare IPv4 & IPv6 CIDR Aralıkları (Olası CDN yönlendirmeleri için)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header X-Forwarded-For;
real_ip_recursive on;

# --- Rate Limiting Zones (Kullanıcının Gerçek IP'si Başına İzolasyon) ---
# $binary_remote_addr artık proxy IP'si değil, her bağımsız kullanıcının kendi gerçek IP adresidir.
limit_req_zone $binary_remote_addr zone=scrape_limit:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=200r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip sıkıştırma
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Sağlık kontrolü (Docker / Railway için)
    location /health {
        access_log off;
        return 200 "ok";
    }

    # Sağlık kontrolü (Docker / Railway için)
    location /healthz {
        access_log off;
        return 200 "ok";
    }

    # SPA için tüm route'ları index.html'e yönlendir
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/scrape — sıkı rate limit (dakikada 1 istek, burst 1)
    location /api/scrape {
        limit_req zone=scrape_limit burst=1 nodelay;
        limit_req_status 429;
        resolver [fd12::10] ipv6=on valid=1s;
        set $backend_endpoint http://backend.railway.internal:8080;
        proxy_pass $backend_endpoint;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api isteklerini backend'e proxy et
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        limit_req_status 429;
        resolver [fd12::10] ipv6=on valid=1s;
        set $backend_endpoint http://backend.railway.internal:8080;
        proxy_pass $backend_endpoint;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Statik varlıklar için uzun süreli önbellek (Vite hash'li dosya adları)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Güvenlik header'ları
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS: Tarayıcılara yalnızca HTTPS kullanmasını söyler (Railway edge'de TLS terminate edilir).
    # max-age=1 yıl, subdomain'leri de kapsar.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP: Kaynak kısıtlama politikası.
    # style-src 'unsafe-inline': react-simple-maps (d3) SVG inline stiller için gereklidir.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
}
