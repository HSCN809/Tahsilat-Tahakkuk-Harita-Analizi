services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - backend_cargo_target:/app/backend/target
      - frontend_node_modules:/app/frontend/node_modules
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - SCRAPE_TOKEN=${SCRAPE_TOKEN:-dev-token}
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:8000,http://127.0.0.1:5173
    networks:
      default:
        aliases:
          - backend.railway.internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NGINX_CONF=nginx-dev.conf
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend_cargo_target:
  frontend_node_modules:
